<!DOCTYPE html>

<body>
    <header>
        <h1>Contato</h1>

            <a href="index.html">INÍCIO</a>

            <a href="p4.html">CONTATO</a>
        </nav>
    </header>

    <main>
        <section class="contato-form">
            <h2>Entre em Contato</h2>
            <form id="form-contato">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Seu nome" required>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="_replyto" placeholder="seu@email.com" required>

                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva sua mensagem..." required></textarea>

                <button type="submit">Enviar</button>
            </form>
            <p id="statusMensagem" class="status-msg"></p>
        </section>
    </main>

    <footer>
        <span>&copy;2025</span>

    </footer>

    <script src="contato.js"></script>
